stages:
  - build
  - test
  - deploy

build_job:
  stage: build
  script:
    - 'echo "Krok 1 - Symulacja budowania projektu..."'
    - 'sleep 2'

test_job:
  stage: test
  script:
    - 'echo "Krok 2 - Uruchamianie testow..."'
    - 'echo "Wszystkie testy zaliczone pomyslnie."'

deploy_test_job:
  stage: deploy
  script:
    - 'echo "Krok 3 - Wdrazanie na srodowisko testowe..."'
  environment:
    name: test