stages:
  - build
  - test
  - deploy

image: python:3.11-slim

build_job:
  stage: build
  script:
    - echo "Budowanie aplikacji i instalacja zależności..."
    - pip install pytest flake8
    - mkdir -p dist
    - cp *.py dist/
  artifacts:
    paths:
      - dist/

test_job:
  stage: test
  script:
    - echo "Uruchamianie testów jednostkowych..."
    - pytest
  dependencies:
    - build_job

deploy_test_job:
  stage: deploy
  script:
    - echo "Wdrażanie wersji $CI_COMMIT_SHORT_SHA na środowisko testowe..."
  environment:
    name: test
    url: https://test.twoja-aplikacja.example.com